name: Build SED Calendar Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package.json
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows installer and portable EXE
        working-directory: desktop
        run: npm run dist:win
      - name: Publish Windows EXE files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v1.7.0"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            $files = Get-ChildItem "desktop/dist/*.exe" | ForEach-Object { $_.FullName }
            gh release upload $tag @files --repo "${{ github.repository }}" --clobber
          } else {
            $files = Get-ChildItem "desktop/dist/*.exe" | ForEach-Object { $_.FullName }
            gh release create $tag @files --repo "${{ github.repository }}" --title "SED Calendar 2026 v1.7.0" --notes "Calendar with note detail windows and Once/All recurring event clearing. Windows desktop edition."
          }
