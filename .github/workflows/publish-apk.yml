name: Build and Publish SED Calendar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish APK as public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.6.0"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --title "SED Calendar 2026 v1.6.0" --notes "Updated notes with title-only list and full note view; Once/All recurring event clearing; Android APK edition."
          fi